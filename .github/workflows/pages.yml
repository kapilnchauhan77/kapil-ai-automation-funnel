name: Retire GitHub Pages Site

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Verified Netlify site root, including https://
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build redirect artifact
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: npm run build:github-pages-redirect -- --target "$TARGET_URL"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
